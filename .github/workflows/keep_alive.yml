name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 12 minutes to prevent Render free instance from sleeping (Render sleeps after 15 mins)
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Backend Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          TARGET_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$TARGET_URL" ]; then
            echo "::notice ::RENDER_BACKEND_URL secret is not configured yet. Add your Render URL (e.g. https://your-backend.onrender.com) to GitHub Settings -> Secrets -> Actions to keep it awake automatically."
            exit 0
          fi
          
          # Clean URL
          TARGET_URL="${TARGET_URL%/}"
          HEALTH_URL="${TARGET_URL}/api/health"
          
          echo "Pinging: ${HEALTH_URL} at $(date -u)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "$HEALTH_URL" || echo "000")
          echo "Response HTTP Status: ${STATUS}"
          
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Backend is awake and responding!"
          else
            echo "Wake-up ping sent (Render may be starting up, status: ${STATUS})"
          fi
